<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR GLTF/GLB Demo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .overlay {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .overlay code {
      color: #8ef;
      word-break: break-all;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <strong>Mobile AR Demo</strong><br>
    Model path 1: de>./assets/gltfglb_magic_wand_animation.glb</code><br>
    Model path 2: de>./assets/gltfglb_magic_wand_animation.gltf</code><br>
    Marker: de>./assets/pattern-1784544729490.patt</code>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <a-assets>
      <a-asset-item id="wandGlb" src="./assets/gltfglb_magic_wand_animation.glb"></a-asset-item>
      <a-asset-item id="wandGltf" src="./assets/gltfglb_magic_wand_animation.gltf"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="./assets/pattern-1784544729490.patt">
      <a-entity
        id="modelEntity"
        gltf-model="#wandGlb"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        animation-mixer
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const glbPath = './assets/gltfglb_magic_wand_animation.glb';
    const gltfPath = './assets/gltfglb_magic_wand_animation.gltf';

    window.addEventListener('load', () => {
      const modelEntity = document.querySelector('#modelEntity');
      if (!modelEntity) return;

      if (document.querySelector('[src="' + glbPath + '"]')) {
        modelEntity.setAttribute('gltf-model', '#wandGlb');
      } else {
        modelEntity.setAttribute('gltf-model', '#wandGltf');
      }
    });
  </script>
</body>
</html>
